# wrangler.toml
#
# Plain English: the Worker's wiring diagram. It names the code, the storage
# it is allowed to touch (D1 database, KV namespace, R2 bucket, the run-lock
# Durable Object), the 5-minute cron, the public hostname, and the non-secret
# settings. Secrets are NOT here: they are set with "npm run secrets -- --worker".

name = "wg-admin"
main = "worker/src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5bdc4d7840e522355b86631e6b8fac2b"
workers_dev = false

# The dashboard's address. wrangler creates the DNS record for it.
routes = [
  { pattern = "wg-admin.clydeford.net", custom_domain = true }
]

# Static files (stylesheet, client script, QR library).
[assets]
directory = "worker/public"

# Every 5 minutes: drift check, auto-destroy, cost guard, heartbeat watchdog.
[triggers]
crons = ["*/5 * * * *"]

# ── Storage ──────────────────────────────────────────────────────────────────

[[d1_databases]]
binding = "DB"
database_name = "wg-admin"
database_id = "20805808-8f19-44b3-9246-36240d3bb705"
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "STATUS"
id = "efa95d8c05e34444b6a95c39055844d5"

[[r2_buckets]]
binding = "STATE"
bucket_name = "wg-admin-tfstate"

[[durable_objects.bindings]]
name = "RUN_LOCK"
class_name = "RunLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunLock"]

# ── Non-secret settings ──────────────────────────────────────────────────────

[vars]
PUBLIC_URL = "https://wg-admin.clydeford.net"
WG_DNS_NAME = "wg.clydeford.net"
WG_PORT = "51820"
WG_SUBNET = "10.13.13.0/24"
# IPv6 inside the tunnel (unique local), so full-tunnel clients get IPv6 out of Azure.
WG_SUBNET6 = "fd13:13::/64"
# The server's WireGuard PUBLIC key. Public by design: every client config has it.
# The private key is only in .env, GitHub secrets and the VM, never the Worker.
WG_SERVER_PUBLIC_KEY = "wapbe4SDSmZoefARMVLSAR2KHjjCU3DJ3McGiXQ+3yc="
# Web Push (phone alerts in the wg-admin app): the PUBLIC half of the signing key.
# Phones use it to check alerts really come from this dashboard. Private half is a secret.
VAPID_PUBLIC_KEY = "BPCo9BkamgQtJcA3JvUV4_VDRmtFZvj2FUsD6pVMVfbsHXBD4dYKmO7DHeDO5ksQroxeSxtwg6d_5H2nJlD0g98"
# Loopback test address on the VM (dummy interface), outside the tunnel subnet.
WG_LOOPBACK_IP = "10.13.255.1"
AZURE_REGION = "uksouth"
AZURE_VM_SIZE = "Standard_B1s"
AZURE_RESOURCE_GROUP = "rg-wg-ondemand"
# The Azure VNet the VM lives in; clients can opt in to routing it through the tunnel.
AZURE_VNET_CIDR = "10.50.0.0/16"
HOME_LAN_CIDR = "192.168.1.0/24"
SSH_ALLOWED_CIDR = ""
AUTO_DESTROY_DEFAULT_HOURS = "4"
IDLE_DESTROY_MINUTES = "0"
MONTHLY_BUDGET_GBP = "10"
# Estimated running cost: B1s (~£0.0093/h) + 30 GB StandardSSD (~£0.0027/h) + Standard static IPv4
# (£0.0037/h, Azure retail price 2026-09). The IPv6 address is free.
HOURLY_RATE_GBP = "0.0157"
# Standby (VM deallocated, disk and IP kept): disk + IP only, about £4.65 a month.
STANDBY_RATE_GBP = "0.0064"
# What the auto-destroy timer and the idle limit do: "destroy" (back to £0) or "hibernate" (Standby).
# The cost guard always destroys.
EXPIRY_ACTION = "destroy"
# A VM left in Standby longer than this is torn down, so a forgotten one cannot cost money for ever.
STANDBY_MAX_DAYS = "7"
