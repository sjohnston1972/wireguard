# Lab 24 (labs batch 3 plan, area C2; spec §17, ruling 33). AZ-305 study
# guide skills this lab touches (the outline "as of April 17, 2026"):
#   Design data storage solutions > Design data storage solutions for
#   semi-structured and unstructured data: "Recommend a solution for storing
#   semi-structured data", "Recommend a data storage solution to balance
#   features, performance, and costs".
# Costs are GBP list prices for UK South (Retail Prices API, 2026-10-05),
# rounded up, all authored: serverless request units are priced per 1M
# ("1M RUs", Azure Cosmos DB serverless, £0.2242), a unit the price feed
# cannot read, and "Data Stored" (£0.1887 a GB a month) is a meter name
# several Cosmos DB products share (batch 2 ruling 2). Light use, about
# 10,000 RU an hour (a few hundred small reads and writes from Data
# Explorer), is £0.0022/h; under 1 GB stored is about £0.0003/h. Periodic
# backup's two copies are free. An idle serverless account costs only its
# storage.
