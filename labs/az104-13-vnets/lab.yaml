# Lab 13 (batch 2 plan area B2). AZ-104 study guide skills this lab touches
# ((V) the wording against the current outline):
#   Implement and manage virtual networking > Configure and manage virtual
#   networks in Azure: "Create and configure virtual networks and subnets".
#   Configure secure access to virtual networks: "Create and configure
#   network security groups (NSGs) and application security groups (ASGs)",
#   "Evaluate effective security rules in NSGs".
# Costs are GBP list prices for UK South (Retail Prices API, 2026-10-05),
# rounded up. The VMs and their OS disks carry retail entries the price feed
# refreshes; npm run labs-verify -- --meters az104-13-vnets checks them
# (Standard_B1s Linux £0.0089/h; S4 LRS Disk £1.28 a month, about
# £0.0018/h). The VNet, subnets, NSGs, ASGs, NICs and managed boot
# diagnostics are free.
