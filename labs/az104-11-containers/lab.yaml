# Lab 11 (batch 2 plan area B1). AZ-104 study guide skills this lab touches
# ((V) the wording against the current outline):
#   Deploy and manage Azure compute resources > Provision and manage
#   containers in the Azure portal: "Create and manage an Azure container
#   registry", "Provision a container by using Azure Container Instances",
#   "Provision a container by using Azure Container Apps", "Manage sizing and
#   scaling for containers, including Azure Container Instances and Azure
#   Container Apps".
# Costs are GBP list prices for UK South from the Retail Prices API
# (2026-10-05), rounded up. npm run labs-verify -- --meters az104-11-containers:
#   Basic Registry Unit   £0.1257/day = £0.0052/h (authored 0.0053)
# Authored (ruling 2): ACI's "Standard vCPU Duration" (£0.0352 per vCPU hour)
# shares its name with Logic Apps, and "Standard Memory Duration" (£0.0039
# per GB hour) is priced per "1 GB Hour", a unit the feed does not read.
# The Container Apps environment is consumption only with no private
# endpoint or planned maintenance, so it has no fixed charge, and an app
# scaled to zero costs nothing; a few requests stay inside the monthly
# free grant (180,000 vCPU-seconds, 2 million requests). The registry is
# billed by the day, so a short session still pays about £0.13 for it.
id: az104-11-containers
version: 1
title: "Containers: ACI and Container Apps"
summary: >-
  A container in Azure Container Instances with a private address, a Container Apps app that scales to
  zero behind public HTTPS, and an empty Basic container registry to push your own image to.
exam: AZ-104
skill_areas: [az104.compute]
level: associate
type: explore
prerequisites: []
cost:
  items:
    - { name: "Container Instances group, 0.5 vCPU", gbp_h: 0.0176 }
    - { name: "Container Instances group, 0.5 GB memory", gbp_h: 0.002 }
    - { name: "Container registry, Basic", gbp_h: 0.0053, retail: { meter: "Basic Registry Unit", unit: "1/Day" } }
    - { name: "Container Apps environment and app (consumption, scales to zero)", gbp_h: 0 }
  pricey: null
timing: { deploy_min: 5, destroy_min: 6, session_h: 2, max_h: 6 }
capacity: { vm_sizes: [] }
regions: { secondary: null }
connectivity: { peering: optional, dns_link: false, subnets_used: 1 }
identity:
  creates: []
  roles: []
  governance: false
