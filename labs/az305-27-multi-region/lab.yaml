id: az305-27-multi-region
version: 3
title: "Multi-region app with Traffic Manager and Front Door"
summary: >-
  A tiny web app running in container instances in uksouth and ukwest, behind both Traffic Manager (DNS
  priority routing) and Front Door Standard, so you can stop one region and watch each front end fail over.
exam: AZ-305
skill_areas: [az305.infra, az305.continuity, az700.delivery]
level: expert
type: explore
