cost:
  items:
    - { name: "Container Instances, uksouth, 0.5 vCPU", gbp_h: 0.0176 }
    - { name: "Container Instances, uksouth, 0.5 GB memory", gbp_h: 0.002 }
    - { name: "Container Instances, ukwest, 0.5 vCPU", gbp_h: 0.0191, region: secondary }
    - { name: "Container Instances, ukwest, 0.5 GB memory", gbp_h: 0.0021, region: secondary }
    - { name: "Front Door Standard, base fee", gbp_h: 0.0362 }
    - { name: "Front Door requests, light use", gbp_h: 0.0001 }
    - { name: "Traffic Manager health checks, external endpoint", gbp_h: 0.0006, qty: 2 }
    - { name: "Traffic Manager DNS queries, light use", gbp_h: 0.0001 }
  pricey: "Front Door Standard, base fee"
timing: { deploy_min: 5, destroy_min: 21, session_h: 2, max_h: 4 }
