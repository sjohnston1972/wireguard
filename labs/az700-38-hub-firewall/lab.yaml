# Lab 38 (AZ-700 plan, area Z2; was AZ-305 28, ruling 40). AZ-700 study
# guide skills this lab covers (outline "Skills measured as of July 27,
# 2026"):
#   Design and implement Azure network security services > Implement Azure
#   Firewall: "Map requirements to features of Azure Firewall", "Select an
#   appropriate Azure Firewall SKU", "Design an Azure Firewall deployment",
#   "Create and implement an Azure Firewall deployment", "Configure Azure
#   Firewall rules", "Create and implement Azure Firewall Manager policies".
#   Design and implement core networking infrastructure > routing: "Design
#   and implement user-defined routes (UDRs)", and VNet peering.
#   Also AZ-305 Design infrastructure solutions (network security).
# Costs are GBP list prices for UK South (Retail Prices API, 2026-10-06),
# rounded up. Retail entries, checked by npm run labs-verify -- --meters
# az700-38-hub-firewall: "Basic Deployment" (Azure Firewall Basic, 1 Hour)
# £0.2981/h; "Standard IPv4 Static Public IP" £0.0038/h; Standard_B1s
# Linux £0.0089/h; "S4 LRS Disk" £1.2755 a month (about £0.0018/h).
# Authored (ruling 54): Basic data processed, "Basic Data Processed"
# £0.0491/GB (a per-GB unit the feed cannot read), at about 0.1 GB an hour;
# the workspace's few MB of logs, about £0.0005/h. The two firewall
# policies cost nothing: Firewall Manager charges for a policy only when it
# is associated with more than one firewall (Learn, "Azure Firewall Manager
# policy overview", Pricing), and fwp-base has none, fwp-hub one.
id: az700-38-hub-firewall
version: 1
title: "Hub-spoke with Azure Firewall and Firewall Manager policy"
summary: >-
  A hub VNet with Azure Firewall Basic, a parent and a child Firewall Manager policy, and two spokes whose route tables
  send everything through the firewall, so you can allow and deny traffic by FQDN and port and read the firewall's logs.
exam: AZ-700
skill_areas: [az700.security, az700.core, az305.infra]
level: associate
type: explore
prerequisites: [az104-14-peering-udr]
cost:
  items:
    - { name: "Azure Firewall Basic", gbp_h: 0.2981, retail: { meter: "Basic Deployment", unit: "1 Hour" } }
    - { name: "Firewall data processed, about 0.1 GB an hour", gbp_h: 0.0049 }
    - { name: "Public IPs, Standard static (data and management)", gbp_h: 0.0038, qty: 2, retail: { meter: "Standard IPv4 Static Public IP", unit: "1 Hour" } }
    - { name: "Firewall Manager policies (free: one firewall each at most)", gbp_h: 0, qty: 2 }
    - { name: "Log Analytics, a few MB of firewall logs", gbp_h: 0.0005 }
    - { name: "Linux VMs, Standard_B1s", gbp_h: 0.0089, qty: 2, retail: { sku: Standard_B1s } }
    - { name: "OS disks, Standard HDD S4", gbp_h: 0.0018, qty: 2, retail: { meter: "S4 LRS Disk", unit: "1/Month" } }
  pricey: "Azure Firewall Basic"
timing: { deploy_min: 15, destroy_min: 12, session_h: 2, max_h: 3 }
capacity: { vm_sizes: [Standard_B1s, Standard_B1s] }
regions: { secondary: null }
connectivity: { peering: optional, dns_link: false, subnets_used: 3 }
identity:
  creates: []
  roles: []
  governance: false
