# Labs catalogue learning content (labs redesign spec §5). Outside the lab folder: editing it never needs a version bump.
objective: Create public and private DNS zones and see how each answers, including for a VM that registers itself.
learn:
  - Query a public zone's own name servers for A, CNAME and TXT records
  - Link a private zone to a VNet with auto-registration and resolve VM names
  - Add record sets by hand and meet the one registration zone per VNet limit
learning_min: 65
