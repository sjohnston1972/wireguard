# Labs catalogue learning content (labs redesign spec §5). Outside the lab folder: editing it never needs a version bump.
objective: Compare three ways to reach a service privately, a Private Link service, a private endpoint and a service endpoint.
learn:
  - Reach a web server in an unpeered VNet through a Private Link service
  - Resolve a storage account to its private endpoint through a private DNS zone
  - Test a service endpoint policy that lets a subnet reach one storage account
learning_min: 55
