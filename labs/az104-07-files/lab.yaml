# Lab 7 (plan area L6). AZ-104 study guide skills this lab touches ((V) the
# wording against the current outline):
#   Implement and manage storage > Configure Azure Files and Azure Blob
#   Storage: "Create and configure a file share in Azure Storage", "Configure
#   snapshots and soft delete for Azure Files"; Configure access to storage:
#   "Configure Azure Storage firewalls and virtual networks", "Manage access
#   keys".
#   Deploy and manage Azure compute resources > Create and configure virtual
#   machines: "Create a virtual machine".
#   Implement and manage virtual networking: "Configure service endpoints for
#   Azure platform as a service (PaaS)".
# Costs are GBP list prices for UK South, rounded up ((V) at release). The VM
# and its disk carry retail entries the price feed refreshes. A few KB on a
# standard (pay-as-you-go) share cost far less than the authored 0.0001. The
# VNet, NIC, service endpoint, default outbound access and managed boot
# diagnostics add nothing measurable.
id: az104-07-files
version: 1
title: "Azure Files shares mounted from a VM"
summary: >-
  An SMB file share behind a subnet service endpoint and a small Linux VM, with no public IP,
  that mounts it at boot, so you can see Azure Files from the inside.
exam: AZ-104
skill_areas: [az104.storage, az104.compute]
level: associate
type: explore
prerequisites: [az104-05-storage]
cost:
  items:
    - { name: "Linux VM, Standard_B1s", gbp_h: 0.0092, retail: { sku: Standard_B1s } }
    - { name: "OS disk, Standard HDD S4", gbp_h: 0.0018, retail: { meter: "S4 LRS Disk", unit: "1/Month" } }
    - { name: "Azure Files share, LRS, a few KB", gbp_h: 0.0001 }
  pricey: null
timing: { deploy_min: 5, destroy_min: 4, session_h: 2, max_h: 6 }
capacity: { vm_sizes: [Standard_B1s] }
regions: { secondary: null }
connectivity: { peering: optional, dns_link: false, subnets_used: 1 }
identity:
  creates: []
  roles: []
  governance: false
