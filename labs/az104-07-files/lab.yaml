cost:
  items:
    - { name: "Linux VM, Standard_B1s", gbp_h: 0.0083, retail: { sku: Standard_B1s } }
    - { name: "OS disk, Standard SSD E4", gbp_h: 0.0034 }
    - { name: "Azure Files share, LRS, a few MB", gbp_h: 0.0001 }
  pricey: null
timing: { deploy_min: 5, destroy_min: 4, session_h: 2, max_h: 6 }
capacity: { vm_sizes: [Standard_B1s] }
regions: { secondary: null }
connectivity: { peering: optional, dns_link: false, subnets_used: 1 }
identity:
  creates: []
  roles: []
  governance: false
