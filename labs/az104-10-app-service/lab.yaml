# Lab 10 (batch 2 plan area B1). AZ-104 study guide skills this lab touches
# ((V) the wording against the current outline):
#   Deploy and manage Azure compute resources > Create and configure Azure
#   App Service: "Provision an App Service plan", "Configure scaling for an
#   App Service plan", "Create an App Service", "Configure certificates and
#   TLS for an App Service", "Configure deployment slots for an App Service".
# Costs are GBP list prices for UK South from the Retail Prices API
# (2026-10-05). The plan is Standard S1 Linux ("Azure App Service Standard
# Plan - Linux", sku S1, meter "S1 App", £0.0755/h). It stays authored
# (ruling 2): the meter "S1 App" is shared by the Linux (£0.0755/h) and
# Windows (£0.0943/h) plans, and the price feed matches on the meter name
# alone. qty is the default instance count, 1; autoscale may add a second
# (another £0.0755/h) under load. The app, slot and autoscale setting cost
# nothing beyond the plan. ££ by costMarker (ruling 4). Standard, not
# Premium v3 P0v3: the release test's apply was refused for quota ("Current
# Limit (P0v3 VMs): 0"), as on any new pay-as-you-go subscription; Standard
# still has deployment slots and autoscale.
id: az104-10-app-service
version: 2
title: "App Service: plans, slots, scaling"
summary: >-
  A Standard Linux App Service plan with a web app, a staging deployment slot to swap, and
  autoscale from 1 to 2 instances, so you can practise plans, slots and scaling side by side.
exam: AZ-104
skill_areas: [az104.compute]
level: associate
type: explore
prerequisites: []
cost:
  items:
    - { name: "App Service plan, Standard S1 Linux", gbp_h: 0.0755 }
    - { name: "Web app and staging slot (they run on the plan)", gbp_h: 0 }
  pricey: "App Service plan, Standard S1 Linux"
timing: { deploy_min: 4, destroy_min: 3, session_h: 2, max_h: 6 }
capacity: { vm_sizes: [] }
regions: { secondary: null }
connectivity: { peering: "off", dns_link: false, subnets_used: 0 }
identity:
  creates: []
  roles: []
  governance: false
