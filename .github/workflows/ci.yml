# .github/workflows/ci.yml
#
# Plain English: the pre-flight check that runs on every push. It does not
# touch Azure or Cloudflare. It proves the Terraform is well-formed, that the
# cloud-init the VM will receive is valid YAML, and that the helper scripts
# pass their tests. Like "show run | include" before you commit a config.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: terraform validate + render cloud-init
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: fmt
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      - name: validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      # Render the cloud-init with fake values and prove it parses as YAML,
      # and that no Terraform placeholder leaked through unrendered. The
      # gzipped files (encoding gz+b64) are invisible to those text checks,
      # so they are unpacked: the scripts must pass bash -n, and the rule set
      # nft -c where the runner has nft (otherwise a structural check).
      - name: render cloud-init
        run: |
          set -euo pipefail
          cp -r infra "$RUNNER_TEMP/render"
          cd "$RUNNER_TEMP/render"
          rm -f backend.tf
          terraform init -input=false -no-color >/dev/null
          echo 'nonsensitive(local.cloud_init)' | terraform console -no-color \
            -var cloudflare_zone_id=zone \
            -var 'ssh_public_key=ssh-ed25519 AAAA ci' \
            -var wg_server_private_key=PRIVKEY \
            -var 'peers_json=[{"name":"laptop","public_key":"LAPTOPKEYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=","ip":"10.13.13.2"}]' \
            -var agent_token=tok \
            | python3 -c 'import sys,json; s=sys.stdin.read().strip(); s = s[len("<<EOT"):].strip()[:-len("EOT")] if s.startswith("<<EOT") else json.loads(s); open("rendered.yaml","w").write(s)'
          python3 -c '
          import yaml
          d = yaml.safe_load(open("rendered.yaml"))
          paths = [f["path"] for f in d["write_files"]]
          assert "/etc/wireguard/wg0.interface.conf" in paths, paths
          assert "/usr/local/sbin/wg-agent.sh" in paths, paths
          text = open("rendered.yaml").read()
          for marker in ("${indent(", "${wg_", "${agent_", "${peers_"):
              assert marker not in text, "unrendered Terraform placeholder in cloud-init: " + marker
          assert "$$" not in text, "double-dollar leaked into cloud-init"
          assert "PRIVKEY" in text and "LAPTOPKEYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" in text and "tok" in text, "values did not render"
          print("cloud-init OK:", len(paths), "files")
          import base64, gzip, os
          os.makedirs("unpacked", exist_ok=True)
          packed = {}
          for f in d["write_files"]:
              if f.get("encoding") == "gz+b64":
                  body = gzip.decompress(base64.b64decode(f["content"])).decode("utf-8")
                  name = os.path.basename(f["path"])
                  open(os.path.join("unpacked", name), "w", encoding="utf-8", newline="\n").write(body)
                  packed[name] = body
          for name in ("wg-agent.sh", "wg-vitals.sh", "firewall.nft"):
              assert name in packed, "not carried gzipped: " + name + " " + str(sorted(packed))
          for name in ("wg-agent.sh", "wg-vitals.sh"):
              assert packed[name].startswith("#!/"), name + " lost its #! line"
          nft = packed["firewall.nft"]
          assert "table inet wgfw" in nft, "the rule set has no wgfw table"
          depth = 0
          for ch in nft:
              depth += {"{": 1, "}": -1}.get(ch, 0)
              assert depth >= 0, "firewall.nft: a } with no {"
          assert depth == 0, "firewall.nft: unbalanced braces"
          print("unpacked OK:", ", ".join(sorted(packed)))
          '
          for f in unpacked/*.sh; do
            bash -n "$f"
            echo "bash -n OK: $f"
          done
          if command -v nft >/dev/null 2>&1; then
            sudo nft -c -f unpacked/firewall.nft
            echo "nft -c OK: unpacked/firewall.nft"
          else
            echo "nft is not on this runner: firewall.nft had the structural check only"
          fi

  # Labs (labs spec §11.1): every lab.yaml, readme and the address pool, a
  # version bump for every lab changed against main, then per lab (and the
  # template) terraform fmt, init -backend=false, validate and the HCL scope
  # check (hcl2json into infra/ci/lab-scope.mjs --hcl). A lab with no
  # terraform/ folder fails here. No cloud calls, no secrets.
  labs:
    name: labs check + terraform + scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # labs-check --base compares each lab folder with main's.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - run: npm ci
      # hcl2json, pinned by version and checksum: checked before it is made runnable.
      - name: install hcl2json
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo hcl2json_linux_amd64 https://github.com/tmccombs/hcl2json/releases/download/v0.6.9/hcl2json_linux_amd64
          echo "b609e37094948c0b77cd8c6c0baaf8af2bd168c685c6e3334d671cc9692c34a5  hcl2json_linux_amd64" | sha256sum -c -
          chmod +x hcl2json_linux_amd64
          mkdir -p "$RUNNER_TEMP/bin"
          mv hcl2json_linux_amd64 "$RUNNER_TEMP/bin/hcl2json"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Bicep, pinned by version and checksum (scripts/lib/bicep.mjs): checked
      # before it is made runnable; labs-tf checks it again before each use.
      - name: install bicep
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo bicep-linux-x64 https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          echo "64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a  bicep-linux-x64" | sha256sum -c -
          chmod +x bicep-linux-x64
          mkdir -p "$RUNNER_TEMP/bin"
          mv bicep-linux-x64 "$RUNNER_TEMP/bin/bicep"
      - name: labs-check against main
        run: |
          git fetch --no-tags origin main
          npm run labs-check -- --base origin/main
      # labs-tf and labs-topology give terraform a plugin cache of each run's own
      # (withTfRunner, scripts/labs-tf.mjs): with no lock file a shared cache is
      # never reused, only rewritten in place, which races between runs.
      - name: labs-tf
        env:
          LABS_TF_REQUIRE_HCL2JSON: "1"
          LABS_TF_REQUIRE_BICEP: "1"
          BICEP: ${{ runner.temp }}/bin/bicep
        run: npm run labs-tf
      # Each lab's planned diagram (lab topology spec §5): regenerated from the
      # mock plan and compared with shared/topology/planned; a stale file fails.
      - name: labs-topology (planned diagrams are fresh)
        env:
          BICEP: ${{ runner.temp }}/bin/bicep
          HCL2JSON: ${{ runner.temp }}/bin/hcl2json
        run: npm run labs-topology -- --check
      # The readme diagrams (shared/guides): each architecture SVG drawn again
      # from its planned diagram and compared byte for byte, each Mermaid
      # concept SVG's stamp compared with its source (no browser needed), every
      # readme sketch covered, the size cap and the privacy rules.
      - name: labs-diagrams (readme diagrams are fresh)
        run: npm run labs-diagrams -- --check

  scripts:
    name: typecheck + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm run bundle-size
      - run: npm test
